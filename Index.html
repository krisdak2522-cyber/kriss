<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Tessera 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<style>
/* Layout: speedrun table — board on the left, stopwatch and splits on the right; stacks on phones. Single deep-ink look by choice. */
:root {
  color-scheme: dark;
  --ink: #0e1a21;
  --felt: #15262f;
  --rail: #213844;
  --line: #2f4b59;
  --chalk: #eef2ea;
  --mute: #8fa8b2;
  --clock: #ffb347;
  --good: #63d69c;
  --bad: #ff6f61;
  --gold: #f2c94c;
  --display: "Bricolage Grotesque", "Noto Sans Thai", system-ui, sans-serif;
  --body: "Noto Sans Thai", "Bricolage Grotesque", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--clock); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; margin: 0; }
.brand h1 b { color: var(--clock); }
.brand span { font-family: var(--mono); font-size: 11px; color: var(--mute); letter-spacing: 0.12em; text-transform: uppercase; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--felt); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-family: var(--mono); }
.chip[aria-pressed="true"] { border-color: var(--clock); color: var(--clock); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--felt); padding: 10px 14px; min-width: 0; }
.stat label { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
.stat output { display: block; font-family: var(--mono); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#penalty { color: var(--bad); }
#best { color: var(--gold); }

.table { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
@media (max-width: 760px) { .table { grid-template-columns: minmax(0, 1fr); } }

.board-wrap { position: relative; width: 100%; max-width: 620px; aspect-ratio: 1; margin: 0 auto; }
.board {
  position: absolute; inset: 0; display: grid; gap: 3px; padding: 3px;
  background: var(--rail); border-radius: 12px; touch-action: manipulation; user-select: none;
}
.tile {
  position: relative; border: 0; padding: 0; border-radius: 6px;
  background-repeat: no-repeat; transition: transform .14s ease, box-shadow .14s ease, filter .2s;
}
.tile:hover { filter: brightness(1.08); }
.tile.sel { transform: scale(.92); box-shadow: 0 0 0 3px var(--clock), 0 0 24px rgba(255,179,71,.45); z-index: 2; }
.tile.ok::after {
  content: ""; position: absolute; right: 6px; bottom: 6px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--good); box-shadow: 0 0 0 2px rgba(14,26,33,.7);
}
body.no-locks .tile.ok::after { display: none; }
.tile.pop { animation: pop .22s ease; }
@keyframes pop { 50% { transform: scale(1.06); } }
.board.solved .tile { border-radius: 0; }
.board.solved { gap: 0; transition: gap .3s; }
.peek { position: absolute; inset: 3px; border-radius: 10px; background-size: cover; pointer-events: none; opacity: 0; transition: opacity .15s; }
.peek.on { opacity: 1; }

.overlay {
  position: absolute; inset: 0; border-radius: 12px; background: rgba(14,26,33,.9);
  display: grid; place-content: center; text-align: center; padding: 24px; gap: 12px; z-index: 5; overflow-y: auto;
}
.overlay h2 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 6vw, 44px); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.overlay p { margin: 0 auto; color: var(--mute); max-width: 40ch; line-height: 1.55; }
.overlay .big { font-family: var(--mono); font-size: 42px; font-weight: 700; color: var(--clock); font-variant-numeric: tabular-nums; }
.overlay ul { text-align: left; margin: 4px auto; padding-left: 20px; color: var(--chalk); line-height: 1.6; max-width: 46ch; font-size: 14px; }
.cta {
  justify-self: center; background: var(--clock); color: var(--ink); border: 0; border-radius: 999px;
  padding: 12px 28px; font-family: var(--display); font-weight: 800; font-size: 18px;
}
.cta:hover { filter: brightness(1.06); }

aside { display: grid; gap: 14px; }
.clock { background: var(--felt); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.ring { width: 112px; height: 112px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--rail); }
.ring .arc { stroke: var(--good); stroke-linecap: round; transition: stroke .2s; }
.ring.over .arc { stroke: var(--bad); }
.ring.frozen .arc { stroke: #8fd3ff; }
.ring .read { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring output { font-family: var(--mono); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.ring.over output { color: var(--bad); }
.ring small { font-family: var(--mono); font-size: 10px; color: var(--mute); letter-spacing: .08em; }
.moves { display: grid; gap: 6px; font-size: 13px; color: var(--mute); }
.moves strong { font-family: var(--mono); color: var(--chalk); font-size: 20px; font-variant-numeric: tabular-nums; }
.moves .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.par-ok { color: var(--good) !important; }
.par-over { color: var(--bad) !important; }

.panel { background: var(--felt); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
.powers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pw { background: var(--rail); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; display: grid; gap: 2px; justify-items: center; text-align: center; }
.pw:disabled { opacity: .38; cursor: not-allowed; }
.pw:not(:disabled):hover { border-color: var(--clock); }
.pw .k { font-family: var(--mono); font-size: 11px; color: var(--mute); }
.pw .n { font-weight: 600; font-size: 13px; }
.pw .c { font-family: var(--mono); font-weight: 700; color: var(--clock); }
.pw .d { font-size: 10px; color: var(--mute); }
.log { font-family: var(--mono); font-size: 12px; color: var(--mute); min-height: 1.5em; line-height: 1.5; }
.log em { color: var(--good); font-style: normal; }
.log b { color: var(--bad); font-weight: 500; }

.splits { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.splits li { display: grid; grid-template-columns: 18px 36px minmax(0, 1fr) auto 10px; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; font-size: 13px; }
.splits li.now { background: var(--rail); }
.splits .no { font-family: var(--mono); color: var(--mute); font-size: 11px; }
.splits img { width: 36px; height: 36px; border-radius: 5px; display: block; }
.splits .nm { min-width: 0; line-height: 1.25; }
.splits .nm b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.splits .nm small { color: var(--mute); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.splits .tm { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--mute); }
.splits li.done .tm { color: var(--chalk); }
.splits .md { width: 10px; height: 10px; border-radius: 50%; background: transparent; }
.splits .md.gold { background: var(--gold); }
.splits .md.slow { background: var(--line); }

@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Tessera <b>10</b></h1><span id="tagline">Masterpiece speedrun</span></div>
    <div class="tools">
      <button class="chip" id="restartBtn" type="button">↺ Restart</button>
      <button class="chip" id="langBtn" type="button">ไทย</button>
      <button class="chip" id="lockBtn" type="button" aria-pressed="true">● Locks</button>
      <button class="chip" id="soundBtn" type="button" aria-pressed="true">♪ On</button>
    </div>
  </header>

  <section class="stats" aria-label="Scoreboard">
    <div class="stat"><label data-i="total">Total time</label><output id="total">0.00 s</output></div>
    <div class="stat"><label data-i="round">Painting</label><output id="round">1 / 6</output></div>
    <div class="stat"><label data-i="penalty">Penalty</label><output id="penalty">+0.0 s</output></div>
    <div class="stat"><label data-i="best">Best total</label><output id="best">—</output></div>
  </section>

  <div class="table">
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Puzzle board"></div>
      <div class="peek" id="peek"></div>
      <div class="overlay" id="overlay"></div>
    </div>

    <aside>
      <div class="clock">
        <div class="ring" id="ring">
          <svg viewBox="0 0 112 112" aria-hidden="true">
            <circle class="track" cx="56" cy="56" r="48"></circle>
            <circle class="arc" id="arc" cx="56" cy="56" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"></circle>
          </svg>
          <div class="read"><output id="time">0.00</output><small id="targetLbl">TARGET 10 s</small></div>
        </div>
        <div class="moves">
          <div class="row"><span data-i="swaps">Swaps</span><strong id="swaps">0</strong></div>
          <div class="row"><span data-i="par">Par (minimum)</span><strong id="par">0</strong></div>
          <div class="row"><span data-i="grid">Grid</span><strong id="gridSz">3×3</strong></div>
        </div>
      </div>

      <div class="panel">
        <h3 data-i="powers">Power-ups</h3>
        <div class="powers">
          <button class="pw" id="pwFreeze" type="button"><span class="k">F</span><span class="n" data-i="freeze">Freeze</span><span class="d" data-i="freezeD">clock stops 3 s</span><span class="c" id="cFreeze">2</span></button>
          <button class="pw" id="pwPeek" type="button"><span class="k">P</span><span class="n" data-i="peek">Peek</span><span class="d" data-i="peekD">see it 1 s</span><span class="c" id="cPeek">2</span></button>
          <button class="pw" id="pwFix" type="button"><span class="k">X</span><span class="n" data-i="fix">Fix</span><span class="d" data-i="fixD">+2 s penalty</span><span class="c" id="cFix">2</span></button>
        </div>
        <div class="log" id="log"></div>
      </div>

      <div class="panel">
        <h3 data-i="splitsH">Splits</h3>
        <ol class="splits" id="splits"></ol>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {
const T = {
  en: {
    tagline: "Masterpiece speedrun", total: "Total time", round: "Painting", penalty: "Penalty", best: "Best total",
    swaps: "Swaps", par: "Par (minimum)", grid: "Grid", powers: "Power-ups", splitsH: "Splits",
    freeze: "Freeze", peek: "Peek", fix: "Fix", freezeD: "clock stops 3 s", peekD: "see it 1 s", fixD: "+2 s penalty",
    locks: "Locks", on: "On", off: "Off", lang: "ไทย", restart: "Restart", target: "TARGET",
    introTitle: "Rebuild six masterpieces as fast as you can",
    introBody: "Each painting is cut up and shuffled. Tap two tiles to swap them. The clock counts up, and your total time is your score.",
    rules: [
      "Six paintings in a row. The grid grows from 3×3 to 5×5.",
      "Par is the fewest swaps that can solve the board. Each swap over par adds 1 s.",
      "Finish a painting in 10 s or less to earn a gold mark.",
      "Freeze stops the clock for 3 s. Peek shows the painting for 1 s. Fix places one tile for a 2 s penalty.",
      "Lowest total time wins. Your best run is saved on this device."
    ],
    start: "Start the clock", next: "Next painting", again: "Run again",
    cleared: "Painting complete", gold: "Gold — under 10 s",
    breakdown: (c, o, f) => `Clock ${c} + over-par ${o} + fix ${f}`,
    over: "Run complete",
    finalBody: (g) => `${g} of 6 paintings finished under 10 s.`,
    newBest: "New personal best!", prevBest: (b) => `Best: ${b}`,
    keys: "Keys: F freeze · P peek · X fix",
    froze: "Clock frozen for 3 s", fixed: "One tile placed (+2 s)", overPar: "Over par +1 s"
  },
  th: {
    tagline: "แข่งต่อภาพศิลปะให้เร็วที่สุด", total: "เวลารวม", round: "ภาพที่", penalty: "เวลาปรับ", best: "สถิติดีสุด",
    swaps: "สลับแล้ว", par: "พาร์ (น้อยสุด)", grid: "ตาราง", powers: "ไอเท็ม", splitsH: "เวลาแต่ละภาพ",
    freeze: "หยุดเวลา", peek: "แอบดู", fix: "วางให้", freezeD: "นาฬิกาหยุด 3 วิ", peekD: "ดูภาพ 1 วิ", fixD: "ปรับ +2 วิ",
    locks: "จุดถูก", on: "เปิด", off: "ปิด", lang: "EN", restart: "เริ่มใหม่", target: "เป้า",
    introTitle: "ต่อภาพศิลปะ 6 ภาพให้เร็วที่สุด",
    introBody: "แต่ละภาพถูกตัดเป็นชิ้นแล้วสลับกัน แตะสองชิ้นเพื่อสลับตำแหน่ง นาฬิกาจะนับเวลาขึ้น เวลารวมคือคะแนนของคุณ",
    rules: [
      "เล่นต่อเนื่อง 6 ภาพ ตารางใหญ่ขึ้นจาก 3×3 ถึง 5×5",
      "พาร์คือจำนวนการสลับน้อยที่สุด สลับเกินพาร์ครั้งละ +1 วินาที",
      "ต่อภาพเสร็จภายใน 10 วินาทีได้เหรียญทอง",
      "หยุดเวลา: นาฬิกาหยุด 3 วิ · แอบดู: เห็นภาพ 1 วิ · วางให้: วาง 1 ชิ้น ปรับ +2 วิ",
      "เวลารวมน้อยที่สุดชนะ สถิติดีสุดบันทึกไว้ในเครื่องนี้"
    ],
    start: "เริ่มจับเวลา", next: "ภาพถัดไป", again: "เล่นอีกครั้ง",
    cleared: "ต่อภาพสำเร็จ", gold: "เหรียญทอง — ไม่ถึง 10 วิ",
    breakdown: (c, o, f) => `นาฬิกา ${c} + เกินพาร์ ${o} + วางให้ ${f}`,
    over: "จบการแข่งขัน",
    finalBody: (g) => `ทำได้ภายใน 10 วินาที ${g} จาก 6 ภาพ`,
    newBest: "ทำสถิติใหม่!", prevBest: (b) => `สถิติดีสุด: ${b}`,
    keys: "ปุ่มลัด: F หยุดเวลา · P แอบดู · X วางให้",
    froze: "หยุดเวลา 3 วินาที", fixed: "วางให้ 1 ชิ้น (+2 วิ)", overPar: "เกินพาร์ +1 วิ"
  }
};

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let lang = store.get("t10-lang", "en");
let sound = store.get("t10-sound", true);
let locks = store.get("t10-locks", true);
const t = () => T[lang];

/* ---------- procedural pictures ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const S = 600;

const pick = (r, a) => a[(r() * a.length) | 0];
const hsl = (r, h, s, l, j = 6) => `hsl(${h + (r() - .5) * j * 2},${s + (r() - .5) * j * 2}%,${l + (r() - .5) * j * 2}%)`;
function dab(g, x, y, ang, len, w, col) {
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round";
  g.beginPath(); g.moveTo(x - Math.cos(ang) * len / 2, y - Math.sin(ang) * len / 2);
  g.lineTo(x + Math.cos(ang) * len / 2, y + Math.sin(ang) * len / 2); g.stroke();
}

const ART = [
  { name: "The Starry Night", artist: "after Vincent van Gogh", year: 1889, draw(g, r) {
    g.fillStyle = "#1c3c80"; g.fillRect(0, 0, S, S);
    const swirls = [[300, 210, 120], [170, 150, 80], [430, 260, 70]];
    for (let i = 0; i < 6500; i++) {
      const x = r() * S, y = r() * 430;
      let ang = Math.sin(y * .02) * .35, near = null;
      for (const [cx, cy, rad] of swirls) { const d = Math.hypot(x - cx, y - cy); if (d < rad) near = [cx, cy, d, rad]; }
      if (near) ang = Math.atan2(y - near[1], x - near[0]) + Math.PI / 2;
      const swirlLight = near && Math.abs(near[2] / near[3] - .65) < .2;
      dab(g, x, y, ang, 10 + r() * 10, 3 + r() * 2.5, swirlLight ? hsl(r, 205, 55, 72) : pick(r, ["#16306a", "#244f9e", "#3466b8", "#5d86d1", "#9cc1ec", "#1b3f8b"]));
    }
    const glow = (x, y, rad, core) => {
      for (let k = 0; k < 220; k++) { const a = r() * 7, d = r() * rad;
        dab(g, x + Math.cos(a) * d, y + Math.sin(a) * d, a + Math.PI / 2, 6 + r() * 6, 3, d < rad * .45 ? core : pick(r, ["#e9e27a", "#f6f0b8", "#cfe0a0", "#7ea6d8"])); }
    };
    glow(520, 85, 70, "#f4b73a"); g.fillStyle = "#f7c948"; g.beginPath(); g.arc(520, 85, 26, 0, 7); g.fill();
    for (let s = 0; s < 9; s++) { const x = 40 + r() * 520, y = 30 + r() * 300; glow(x, y, 18 + r() * 18, "#fff6c4"); }
    for (let i = 0; i < 2600; i++) {
      const x = r() * S, y = 400 + r() * 200, hill = 440 + Math.sin(x * .012) * 25;
      if (y < hill) continue;
      dab(g, x, y, Math.sin(x * .02) * .4, 9 + r() * 8, 3, pick(r, ["#1d3156", "#2b4a5e", "#3d5e4a", "#16243e", "#55704f"]));
    }
    for (let h = 0; h < 22; h++) { const x = 180 + r() * 400, y = 475 + r() * 80;
      g.fillStyle = "#24334f"; g.fillRect(x, y, 16, 12); g.fillStyle = "#f2c94c"; g.fillRect(x + 5, y + 4, 4, 4); }
    g.fillStyle = "#1e2c48"; g.beginPath(); g.moveTo(352, 470); g.lineTo(358, 390); g.lineTo(364, 470); g.fill();
    for (let i = 0; i < 1600; i++) {
      const y = 70 + r() * 530, half = 15 + (y - 70) / 530 * 55, x = 115 + (r() - .5) * 2 * half + Math.sin(y * .05) * 8;
      dab(g, x, y, -Math.PI / 2 + (r() - .5) * .7, 14 + r() * 14, 4, pick(r, ["#13200f", "#2b3a17", "#46431c", "#5c4a1c", "#1f2d1a"]));
    }
  }},
  { name: "The Great Wave off Kanagawa", artist: "after Katsushika Hokusai", year: 1831, draw(g, r) {
    const sky = g.createLinearGradient(0, 0, 0, S); sky.addColorStop(0, "#d9c9a3"); sky.addColorStop(1, "#efe4c8");

/* ---------- state ---------- */
const TARGET_MS = 10000;

const fmt = (ms) => (ms / 1000).toFixed(2) + " s";
let st;
let best = store.get("t10-besttime", null);

function fresh() {
  return { idx: 0, totalMs: 0, penaltyMs: 0, splits: [], inv: { freeze: 2, peek: 2, fix: 2 },
    n: 3, perm: [], sel: -1, swaps: 0, par: 0, fixes: 0, start: 0, frozenAcc: 0, frozenUntil: 0, last: 0,
    elapsed: 0, playing: false, img: "", thumbs: [] };

    const a = fixed[(Math.random() * fixed.length) | 0];
    let b; do { b = (Math.random() * p.length) | 0; } while (b === a);
    [p[a], p[b]] = [p[b], p[a]];

}

  st.thumbs = ART.map((_, i) => makePicture(i, (Math.random() * 1e9) | 0));
}

  const R = ROUNDS[st.idx];
  st.n = R.n; st.img = st.thumbs[st.idx];
  st.perm = scramble(st.n, R.par); st.par = minSwaps(st.perm);
  st.swaps = 0; st.sel = -1; st.fixes = 0; st.elapsed = 0;
  $("peek").style.backgroundImage = `url(${st.img})`;
  $("board").classList.remove("solved");
  drawClock(0, false);
  renderBoard(); renderHud(); renderSplits();
}

/* ---------- render ---------- */
function renderBoard() {
  const b = $("board"), n = st.n;
  b.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  b.innerHTML = "";
  st.perm.forEach((tile, pos) => {
    const el = document.createElement("button");
    el.type = "button"; el.className = "tile"; el.dataset.pos = pos;
    const tr = Math.floor(tile / n), tc = tile % n;
    el.style.backgroundImage = `url(${st.img})`;
    el.style.backgroundSize = `${n * 100}% ${n * 100}%`;
    el.style.backgroundPosition = `${tc / (n - 1) * 100}% ${tr / (n - 1) * 100}%`;
    if (tile === pos) el.classList.add("ok");
    if (pos === st.sel) el.classList.add("sel");
    el.setAttribute("aria-label", `Tile ${pos + 1}${tile === pos ? ", correct" : ""}`);
    b.appendChild(el);
  });
}

const roundPenalty = () => Math.max(0, st.swaps - st.par) * 1000 + st.fixes * 2000;

function renderHud() {
  const live = st.playing ? st.elapsed + roundPenalty() : 0;
  $("total").textContent = fmt(st.totalMs + live);
  $("round").textContent = `${Math.min(st.idx + 1, ROUNDS.length)} / ${ROUNDS.length}`;
  $("penalty").textContent = "+" + ((st.penaltyMs + (st.playing ? roundPenalty() : 0)) / 1000).toFixed(1) + " s";
  $("best").textContent = best ? fmt(best) : "—";
  $("swaps").textContent = st.swaps; $("par").textContent = st.par; $("gridSz").textContent = `${st.n}×${st.n}`;
  const sw = $("swaps"); sw.classList.toggle("par-over", st.swaps > st.par); sw.classList.toggle("par-ok", st.swaps > 0 && st.swaps <= st.par);
  $("cFreeze").textContent = st.inv.freeze; $("cPeek").textContent = st.inv.peek; $("cFix").textContent = st.inv.fix;
  $("pwFreeze").disabled = !st.playing || !st.inv.freeze;
  $("pwPeek").disabled = !st.playing || !st.inv.peek;
  $("pwFix").disabled = !st.playing || !st.inv.fix;
}

function renderSplits() {

    const s = st.splits[i], cls = s != null ? "done" : i === st.idx ? "now" : "";

    return `<li class="${cls}"><span class="no">${i + 1}</span><img src="${st.thumbs[i]}" alt=""><span class="nm"><b>${a.name}</b><small>${a.artist}, ${a.year}</small></span><span class="tm">${s != null ? fmt(s) : "—"}</span><span class="md ${md}"></span></li>`;

  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t()[el.dataset.i]; });
  $("tagline").textContent = t().tagline;
  $("langBtn").textContent = t().lang;
  $("restartBtn").textContent = "↺ " + t().restart;
  $("soundBtn").textContent = "♪ " + (sound ? t().on : t().off);
  $("lockBtn").textContent = "● " + t().locks;
  $("targetLbl").textContent = `${t().target} 10 s`;
  $("soundBtn").setAttribute("aria-pressed", sound); $("lockBtn").setAttribute("aria-pressed", locks);

let overlayKind = null, overlayData = null;
function showOverlay(kind, data = {}) {
  overlayKind = kind; overlayData = data;
  const o = $("overlay"), L = t(); o.hidden = false;
  if (kind === "intro") {
    o.innerHTML = `<h2>${L.introTitle}</h2><p>${L.introBody}</p><ul>${L.rules.map(x => `<li>${x}</li>`).join("")}</ul><button class="cta" id="go" type="button">${L.start}</button><p style="font-size:12px">${L.keys}</p>`;
    $("go").onclick = beginRound;
  } else if (kind === "clear") {
    o.innerHTML = `<h2>${data.gold ? L.gold : L.cleared}</h2><div class="big">${fmt(data.time)}</div><p>${L.breakdown(fmt(data.clock), fmt(data.over), fmt(data.fix))}</p><p>${ART[data.i].name} · ${ART[data.i].artist}</p><button class="cta" id="go" type="button">${L.next}</button>`;
    $("go").onclick = () => { hideOverlay(); setupRound(); beginRound(); };
  } else if (kind === "over") {
    o.innerHTML = `<h2>${L.over}</h2><div class="big">${fmt(st.totalMs)}</div><p>${L.finalBody(data.golds)}</p><p style="color:var(--gold)">${data.newBest ? L.newBest : L.prevBest(fmt(best))}</p><button class="cta" id="go" type="button">${L.again}</button>`;

function hideOverlay() { overlayKind = null; $("overlay").hidden = true; }

/* ---------- flow ---------- */
function newRun() { st = fresh(); paintAll(); hideOverlay(); setupRound(); beginRound(); }

function beginRound() {
  hideOverlay();
  const now = performance.now();
  st.playing = true; st.start = now; st.last = now; st.frozenAcc = 0; st.frozenUntil = 0; lastSec = 0;
  beep(660, .1); renderHud(); renderSplits(); requestAnimationFrame(tick);
}

let lastSec = 0;
function tick(now) {
  if (!st.playing) return;
  if (now < st.frozenUntil) st.frozenAcc += now - st.last;
  st.last = now;
  st.elapsed = now - st.start - st.frozenAcc;
  drawClock(st.elapsed, now < st.frozenUntil);
  const sec = Math.floor(st.elapsed / 1000);
  if (sec !== lastSec && sec === 10) beep(220, .2, "square", .03);
  lastSec = sec;
  renderHud();
  requestAnimationFrame(tick);
}
function drawClock(ms, frozen) {
  const C = 301.6, frac = Math.min(1, ms / TARGET_MS);
  $("arc").style.strokeDashoffset = C * (1 - frac);
  $("time").textContent = (ms / 1000).toFixed(2);
  $("ring").classList.toggle("over", ms > TARGET_MS && !frozen);
  $("ring").classList.toggle("frozen", frozen);
}

function winRound() {
  st.playing = false;
  const clock = st.elapsed, over = Math.max(0, st.swaps - st.par) * 1000, fix = st.fixes * 2000;
  const time = clock + over + fix, i = st.idx;
  st.splits[i] = time; st.totalMs += time; st.penaltyMs += over + fix;
  drawClock(clock, false);
  $("board").classList.add("solved");
  const gold = time <= TARGET_MS;
  [523, 659, 784, gold ? 1047 : 0].forEach((f, k) => f && setTimeout(() => beep(f, .12, "triangle", .05), k * 90));
  st.idx++;
  renderHud(); renderSplits();
  if (st.idx >= ROUNDS.length) {
    const newBest = best == null || st.totalMs < best;
    if (newBest) { best = st.totalMs; store.set("t10-besttime", best); }
    const golds = st.splits.filter(s => s <= TARGET_MS).length;
    renderHud();
    setTimeout(() => showOverlay("over", { newBest, golds }), 700);
  } else {
    setTimeout(() => showOverlay("clear", { time, clock, over, fix, gold, i }), 650);
  }
}

  [st.perm[a], st.perm[b]] = [st.perm[b], st.perm[a]];
  if (counted) { st.swaps++; if (st.swaps > st.par) log(`<b>${t().overPar}</b>`); }
  st.sel = -1;
  const placed = (st.perm[a] === a) + (st.perm[b] === b);
  beep(placed ? 520 + placed * 140 : 300, .07);
  renderBoard();
  [a, b].forEach(p => $("board").children[p].classList.add("pop"));
  renderHud();
  if (st.perm.every((v, i) => v === i)) winRound();
}

$("board").addEventListener("click", (e) => {
  const el = e.target.closest(".tile"); if (!el || !st || !st.playing) return;
  const pos = +el.dataset.pos;
  if (st.sel === -1) { st.sel = pos; beep(440, .04); renderBoard(); }
  else if (st.sel === pos) { st.sel = -1; renderBoard(); }
  else swap(st.sel, pos);
});

  const tile = wrong[(Math.random() * wrong.length) | 0];
  log(`<b>${t().fixed}</b>`);
  swap(st.perm.indexOf(tile), tile, false);
}
$("pwFreeze").onclick = useFreeze; $("pwPeek").onclick = usePeek; $("pwFix").onclick = useFix;
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "f") useFreeze(); else if (k === "p") usePeek(); else if (k === "x") useFix();
});

$("restartBtn").onclick = newRun;
$("langBtn").onclick = () => { lang = lang === "en" ? "th" : "en"; store.set("t10-lang", lang); applyLang(); };
$("soundBtn").onclick = () => { sound = !sound; store.set("t10-sound", sound); applyLang(); };
$("lockBtn").onclick = () => { locks = !locks; store.set("t10-locks", locks); applyLang(); };

/* ---------- boot: show the first shuffled painting behind the intro ---------- */
st = fresh(); paintAll(); setupRound();
applyLang(); showOverlay("intro");
})();
</script>
